services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/config.php:/var/www/html/config.php:ro
    environment:
      DB_HOST: db
      DB_NOME: minicurso
      DB_USER: root
      DB_SENHA: minicurso
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: minicurso
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pminicurso"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: minicurso
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
